name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so the badge means "still green today" rather than "was green in May".
    - cron: "23 6 * * *"

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck skel.sh

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: chmod +x skel.sh test.sh && ./test.sh
