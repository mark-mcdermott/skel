name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so the badge means "still green today" rather than "was green in May".
    - cron: "23 6 * * *"

jobs:
  # Shared verify loop - definition lives in mm-claude-starter.
  verify:
    uses: mark-mcdermott/mm-claude-starter/.github/workflows/bash-verify.yml@main
    with:
      shellcheck-paths: skel.sh
      test-command: chmod +x skel.sh test.sh && ./test.sh
